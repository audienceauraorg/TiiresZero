<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Checkout - Double Coin Heavy Duty Truck Warehouse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .checkout-layout{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:flex-start;}
    .checkout-section{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:20px;}
    .checkout-section h2{font-size:16px;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .form-row.single{grid-template-columns:1fr;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group label{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.4px;}
    .form-group input{padding:11px 13px;border:1px solid #ddd;border-radius:4px;font-size:14px;font-family:'Poppins',sans-serif;outline:none;transition:border-color .2s;}
    .form-group input:focus{border-color:#e60000;}
    .country-picker{position:relative;}
    #countryList{position:absolute;top:100%;left:0;right:0;z-index:10;max-height:200px;overflow-y:auto;margin:4px 0 0;padding:4px 0;list-style:none;background:#fff;border:1px solid #ddd;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:14px;}
    #countryList li{padding:10px 13px;}
    #countryList li[role=option]{cursor:pointer;}
    #countryList li[role=option]:hover,#countryList li.active{background:#f0f0f0;}
    #countryList li.country-empty{color:#999;}
    .order-summary-card{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:8px;padding:24px;position:sticky;top:90px;}
    .os-title{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e0e0e0;}
    .os-item{display:flex;gap:12px;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f0f0f0;}
    .os-item:last-of-type{border-bottom:none;}
    .os-img{width:54px;height:54px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;}
    .os-img img{width:50px;height:50px;object-fit:contain;display:block;}
    .os-qty-badge{position:absolute;top:-6px;right:-6px;background:#e60000;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .os-info{flex:1;font-size:13px;}
    .os-name{font-weight:600;color:#1a1a1a;line-height:1.3;}
    .os-price{color:#e60000;font-weight:700;margin-top:2px;}
    .os-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;color:#555;}
    .os-row.total{font-size:16px;font-weight:700;color:#1a1a1a;padding-top:10px;border-top:2px solid #e0e0e0;margin-top:4px;}
    .btn-place-order{width:100%;padding:16px;background:#28a745;color:#fff;border:none;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;border-radius:4px;cursor:pointer;margin-top:16px;letter-spacing:.5px;}
    .btn-place-order:hover{background:#218838;}
    .secure-badge{text-align:center;font-size:12px;color:#999;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
    @media(max-width:900px){.checkout-layout{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}}
    @media(max-width:768px){
      .checkout-section{padding:18px;}
      .order-summary-card{position:static;padding:18px;}
    }
  </style>
</head>
<body>
<div id="site-header"></div>

<div style="background:#1a1a1a;color:#fff;padding:20px 0">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <a href="index.html" style="display:flex;align-items:center">
      <svg width="140" height="34" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="20" fill="#1a1a1a" stroke="#e60000" stroke-width="3"/>
        <circle cx="24" cy="24" r="12" fill="none" stroke="#999" stroke-width="4"/>
        <circle cx="24" cy="24" r="4" fill="#e60000"/>
        <text x="52" y="20" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="16" fill="#fff">DOUBLE COIN</text>
        <text x="52" y="38" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="16" fill="#e60000">WAREHOUSE</text>
      </svg>
    </a>
    <div style="display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap">
      <span style="color:#28a745">&#128274; Secure Checkout</span>
      <a href="cart.html" style="color:#aaa">&#8592; Back to Cart</a>
    </div>
  </div>
</div>

<div class="section" style="padding:36px 0 60px;background:#f5f5f5">
  <div class="container">
    <div class="checkout-layout">
      <div>
        <!-- Delivery -->
        <div class="checkout-section">
          <h2>Delivery Details</h2>
          <div class="form-row single"><div class="form-group"><label>Full Name</label><input type="text" id="fullName" autocomplete="name" placeholder="John Doe"/></div></div>
          <div class="form-row single"><div class="form-group"><label>Email</label><input type="email" id="email" autocomplete="email" placeholder="you@example.com"/></div></div>
          <div class="form-row single"><div class="form-group"><label>Phone</label><input type="tel" id="phone" autocomplete="tel" placeholder="+1 555 000 0000"/></div></div>
          <div class="form-row single"><div class="form-group"><label>Address</label><input type="text" id="address" autocomplete="street-address" placeholder="Street, city, state, ZIP / postal code"/></div></div>
          <div class="form-row single"><div class="form-group country-picker"><label for="countryInput">Country</label><input type="text" id="countryInput" role="combobox" aria-expanded="false" aria-controls="countryList" aria-autocomplete="list" autocomplete="off" placeholder="Search country..."/><ul id="countryList" role="listbox" hidden></ul></div></div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary-card">
        <div class="os-title">Order Summary</div>
        <div id="osSummaryItems"></div>
        <div class="os-row"><span>Subtotal</span><span id="osSubtotal">$0.00</span></div>
        <div class="os-row"><span>Shipping</span><span id="osShipping">—</span></div>
        <div class="os-row total"><span>Total</span><span id="osTotal">$0.00</span></div>
        <button class="btn-place-order" onclick="placeOrder('en')">Submit Order on WhatsApp</button>
        <button class="btn-place-order" lang="de" onclick="placeOrder('de')">Bestellung per WhatsApp senden</button>
        <p style="text-align:center;font-size:12px;color:#999;margin-top:12px">Our team will contact you to confirm your order and arrange payment.</p>
        <p lang="de" style="text-align:center;font-size:12px;color:#999;margin-top:12px">Unser Team meldet sich bei Ihnen, um die Bestellung zu bestätigen und die Zahlung zu vereinbaren.</p>
      </div>
    </div>
  </div>
</div>

<script src="components.js"></script>
<script src="products.generated.js"></script><script src="products.js"></script>

<script src="script.js"></script>
<script>
function initPage() {
  const items = document.getElementById('osSummaryItems');
  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const shipping = subtotal>=500?0:49.99;
  items.innerHTML = cart.map(i=>{
    const product = catalogProductForCart(i);
    const image = i.image || product?.image;
    return `
    <div class="os-item">
      <div class="os-img">
        ${image ? `<img src="${image}" alt="${i.brand} ${i.name}" loading="lazy" />` : '<svg width="36" height="36" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#1a1a1a"/><circle cx="32" cy="32" r="16" fill="none" stroke="#555" stroke-width="6"/><circle cx="32" cy="32" r="5" fill="#e60000"/></svg>'}
        <div class="os-qty-badge">${i.qty}</div>
      </div>
      <div class="os-info">
        <div class="os-name">${i.brand} ${i.name}</div>
        <div class="os-price">$${(i.price*i.qty).toFixed(2)} · Qty ${i.qty}</div>
      </div>
    </div>`;
  }).join('') || '<p style="font-size:13px;color:#999">No items in cart.</p>';
  document.getElementById('osSubtotal').textContent='$'+subtotal.toFixed(2);
  document.getElementById('osShipping').textContent=shipping===0?'FREE':'$'+shipping.toFixed(2);
  document.getElementById('osTotal').textContent='$'+(subtotal+shipping).toFixed(2);
}

const COUNTRIES = ['United States','Germany','Afghanistan','Albania','Algeria','Andorra','Angola','Antigua and Barbuda','Argentina','Armenia','Australia','Austria','Azerbaijan','Bahamas','Bahrain','Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan','Bolivia','Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso','Burundi','Cabo Verde','Cambodia','Cameroon','Canada','Central African Republic','Chad','Chile','China','Colombia','Comoros','Congo','Costa Rica','Croatia','Cuba','Cyprus','Czech Republic','Democratic Republic of the Congo','Denmark','Djibouti','Dominica','Dominican Republic','Ecuador','Egypt','El Salvador','Equatorial Guinea','Eritrea','Estonia','Eswatini','Ethiopia','Fiji','Finland','France','Gabon','Gambia','Georgia','Ghana','Greece','Grenada','Guatemala','Guinea','Guinea-Bissau','Guyana','Haiti','Honduras','Hungary','Iceland','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy','Ivory Coast','Jamaica','Japan','Jordan','Kazakhstan','Kenya','Kiribati','Kosovo','Kuwait','Kyrgyzstan','Laos','Latvia','Lebanon','Lesotho','Liberia','Libya','Liechtenstein','Lithuania','Luxembourg','Madagascar','Malawi','Malaysia','Maldives','Mali','Malta','Marshall Islands','Mauritania','Mauritius','Mexico','Micronesia','Moldova','Monaco','Mongolia','Montenegro','Morocco','Mozambique','Myanmar','Namibia','Nauru','Nepal','Netherlands','New Zealand','Nicaragua','Niger','Nigeria','North Korea','North Macedonia','Norway','Oman','Pakistan','Palau','Palestine','Panama','Papua New Guinea','Paraguay','Peru','Philippines','Poland','Portugal','Qatar','Romania','Russia','Rwanda','Saint Kitts and Nevis','Saint Lucia','Saint Vincent and the Grenadines','Samoa','San Marino','Sao Tome and Principe','Saudi Arabia','Senegal','Serbia','Seychelles','Sierra Leone','Singapore','Slovakia','Slovenia','Solomon Islands','Somalia','South Africa','South Korea','South Sudan','Spain','Sri Lanka','Sudan','Suriname','Sweden','Switzerland','Syria','Taiwan','Tajikistan','Tanzania','Thailand','Timor-Leste','Togo','Tonga','Trinidad and Tobago','Tunisia','Turkey','Turkmenistan','Tuvalu','Uganda','Ukraine','United Arab Emirates','United Kingdom','Uruguay','Uzbekistan','Vanuatu','Vatican City','Venezuela','Vietnam','Yemen','Zambia','Zimbabwe'];
const COUNTRY_ALIASES = {us:'United States',usa:'United States',america:'United States','united states of america':'United States',deutschland:'Germany',uk:'United Kingdom'};

const countryInput = document.getElementById('countryInput');
const countryList = document.getElementById('countryList');
let countryMatches = [];
let activeCountry = -1;

function findCountry(value) {
  const q = value.trim().toLowerCase();
  return COUNTRY_ALIASES[q] || COUNTRIES.find(c => c.toLowerCase() === q) || '';
}

function openCountryList(query) {
  const q = query.trim().toLowerCase();
  const aliased = q ? Object.keys(COUNTRY_ALIASES).filter(a => a.startsWith(q)).map(a => COUNTRY_ALIASES[a]) : [];
  countryMatches = [...new Set([...aliased, ...COUNTRIES.filter(c => c.toLowerCase().includes(q))])];
  activeCountry = -1;
  countryList.innerHTML = countryMatches.map(c => `<li role="option">${c}</li>`).join('') || '<li class="country-empty">No matching country</li>';
  countryList.scrollTop = 0;
  countryList.hidden = false;
  countryInput.setAttribute('aria-expanded', 'true');
}

function closeCountryList() {
  countryList.hidden = true;
  countryInput.setAttribute('aria-expanded', 'false');
}

function moveActiveCountry(step) {
  if (!countryMatches.length) return;
  activeCountry = (activeCountry + step + countryMatches.length) % countryMatches.length;
  [...countryList.children].forEach((li, i) => li.classList.toggle('active', i === activeCountry));
  countryList.children[activeCountry].scrollIntoView({ block: 'nearest' });
}

countryInput.addEventListener('focus', () => {
  openCountryList('');
  countryInput.select();
  if (window.innerWidth <= 768) countryInput.scrollIntoView({ block: 'start' });
});
countryInput.addEventListener('input', () => openCountryList(countryInput.value));
countryInput.addEventListener('blur', () => {
  closeCountryList();
  countryInput.value = findCountry(countryInput.value) || countryInput.value;
});
countryInput.addEventListener('keydown', e => {
  if (countryList.hidden && e.key !== 'ArrowDown') return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (countryList.hidden) openCountryList(countryInput.value);
    moveActiveCountry(e.key === 'ArrowDown' ? 1 : -1);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const choice = countryMatches[Math.max(activeCountry, 0)];
    if (choice) countryInput.value = choice;
    closeCountryList();
  } else if (e.key === 'Escape') {
    closeCountryList();
  }
});
// Keep focus on the input while the list is pressed or scrolled.
countryList.addEventListener('mousedown', e => e.preventDefault());
countryList.addEventListener('click', e => {
  const option = e.target.closest('li[role=option]');
  if (!option) return;
  countryInput.value = option.textContent;
  closeCountryList();
});

const ORDER_TEXT = {
  en: {
    emptyCart: 'Your cart is empty.',
    missingDetails: 'Please fill in all fields.',
    invalidEmail: 'Please enter a valid email address.',
    invalidCountry: 'Please choose your country from the list.',
    title: 'NEW ORDER REQUEST',
    customer: 'Customer Details',
    name: 'Name',
    phone: 'Phone',
    address: 'Shipping Address',
    items: 'Items Ordered',
    qty: 'Qty',
    subtotal: 'Subtotal',
    shipping: 'Shipping',
    free: 'FREE',
    total: 'TOTAL',
    submitted: 'Submitted',
    locale: undefined,
    doneTitle: 'Order Request Submitted!',
    doneBody: 'Thank you! Your order has been sent via WhatsApp. Our team will confirm your order and arrange payment.',
    home: 'Back to Home',
  },
  de: {
    emptyCart: 'Ihr Warenkorb ist leer.',
    missingDetails: 'Bitte füllen Sie alle Felder aus.',
    invalidEmail: 'Bitte geben Sie eine gültige E-Mail-Adresse ein.',
    invalidCountry: 'Bitte wählen Sie Ihr Land aus der Liste aus.',
    title: 'NEUE BESTELLANFRAGE',
    customer: 'Kundendaten',
    name: 'Name',
    phone: 'Telefon',
    address: 'Lieferadresse',
    items: 'Bestellte Artikel',
    qty: 'Menge',
    subtotal: 'Zwischensumme',
    shipping: 'Versand',
    free: 'KOSTENLOS',
    total: 'GESAMT',
    submitted: 'Gesendet',
    locale: 'de-DE',
    doneTitle: 'Bestellanfrage gesendet!',
    doneBody: 'Vielen Dank! Ihre Bestellung wurde per WhatsApp gesendet. Unser Team bestätigt Ihre Bestellung und vereinbart die Zahlung mit Ihnen.',
    home: 'Zur Startseite',
  },
};

function placeOrder(lang) {
  const t=ORDER_TEXT[lang];
  if(!cart.length){showToast(t.emptyCart);return;}
  if(lang==='de'&&!countryInput.value.trim())countryInput.value='Germany';
  const fullName=document.getElementById('fullName').value.trim();
  const emailInput=document.getElementById('email');
  const email=emailInput.value.trim();
  const phone=document.getElementById('phone').value.trim();
  const address=document.getElementById('address').value.trim();
  const country=findCountry(countryInput.value);
  if(!fullName||!email||!phone||!address||!countryInput.value.trim()){showToast(t.missingDetails);return;}
  if(!emailInput.checkValidity()){showToast(t.invalidEmail);return;}
  if(!country){showToast(t.invalidCountry);return;}
  const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const shipping=subtotal>=500?0:49.99;
  const itemsList=cart.map(function(i,idx){return '  '+(idx+1)+'. '+i.brand+' '+i.name+'\n     '+t.qty+': '+i.qty+' | $'+(i.price*i.qty).toFixed(2);}).join('\n');
  var waText='━━━━━━━━━━━━━━━━━━━━━━\n'+
    '*🛒 '+t.title+'*\n'+
    '_Double Coin Heavy Duty Truck Warehouse_\n'+
    '━━━━━━━━━━━━━━━━━━━━━━\n\n'+
    '*📋 '+t.customer+'*\n'+
    '• '+t.name+': '+fullName+'\n'+
    '• Email: '+email+'\n'+
    '• '+t.phone+': '+phone+'\n'+
    '\n*📦 '+t.address+'*\n'+
    address+'\n'+
    (lang==='de'&&country==='Germany'?'Deutschland':country)+'\n'+
    '\n*🔧 '+t.items+'*\n'+itemsList+'\n'+
    '\n━━━━━━━━━━━━━━━━━━━━━━\n'+
    '  '+t.subtotal+': $'+subtotal.toFixed(2)+'\n'+
    '  '+t.shipping+': '+(shipping===0?t.free:'$'+shipping.toFixed(2))+'\n'+
    '  *'+t.total+': $'+(subtotal+shipping).toFixed(2)+'*\n'+
    '━━━━━━━━━━━━━━━━━━━━━━\n'+
    '\n_'+t.submitted+': '+new Date().toLocaleString(t.locale)+'_';
  openWhatsAppOrder(lang,waText);
  cart=[];saveCart();
  document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:80vh;text-align:center;font-family:Poppins,sans-serif"><div><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg><h1 style="font-size:28px;margin:20px 0 10px;color:#1a1a1a">'+t.doneTitle+'</h1><p style="color:#666;font-size:15px;margin-bottom:28px">'+t.doneBody+'</p><a href="index.html" style="background:#e60000;color:#fff;padding:13px 30px;border-radius:4px;font-weight:700;text-decoration:none;font-size:14px">'+t.home+'</a></div></div>';
}
</script>
</body>
</html>
